[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "newsworker"
description = "Advanced news feeds extractor and finder library. Helps to automatically extract news from websites without RSS/ATOM feeds"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Ivan Begtin", email = "ivan@begtin.tech" }]
keywords = ["news", "parsing", "extraction", "feeds", "rss", "atom"]
dynamic = ["version"]

dependencies = [
    "pyparsing>=3,<4",
    "lxml>=4.9,<7",
    "cssselect>=1.2,<2",
    "beautifulsoup4>=4.12,<5",
    "qddate>=1.0.16,<2",
    "typer>=0.9,<1",
    "feedgen>=1.0,<2",
    "pyyaml>=6,<7",
    "requests>=2.32.2,<3",
    "urllib3>=1.26,<3",
    "feedparser>=6,<7",
]

classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
]

[project.urls]
Homepage = "https://github.com/ivbeg/newsworker"
Documentation = "https://ivbeg.github.io/newsworker/"
Repository = "https://github.com/ivbeg/newsworker"

[project.optional-dependencies]
test = ["pytest>=8,<9", "pytest-cov>=5,<7"]
dev = ["pytest>=8,<9", "pytest-cov>=5,<7", "ruff==0.14.9", "build>=1,<2", "twine>=5,<7", "mypy>=1.11,<2", "pre-commit>=3,<5", "pip-tools>=7,<8"]
metrics = ["prometheus_client"]
fulltext = ["trafilatura"]
async = ["aiohttp"]
browser = ["playwright>=1.45,<2"]
mcp = ["mcp>=1.10,<2"]

[project.scripts]
newsworker = "newsworker.__main__:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.dynamic]
version = { attr = "newsworker.__version__" }

[tool.setuptools.packages.find]
include = ["newsworker*"]
exclude = ["tests*"]

[tool.setuptools.package-data]
newsworker = ["bridges/*.yaml", "bridges/*.yml", "py.typed"]

# ---------------------------------------------------------------------------
# Tooling configuration (single source of truth)
# ---------------------------------------------------------------------------

[tool.ruff]
# Scope linting to the high-signal rule sets that catch real defects
# (pyflakes + syntax/runtime errors) rather than churning stylistic issues
# across this legacy codebase. Style rules can be enabled incrementally later.
target-version = "py310"
line-length = 100
extend-exclude = ["build", "dist", "docs", "*.egg-info"]

[tool.ruff.lint]
# UP: Python 3.10 syntax; SIM: simpler control flow; S: bandit security checks;
# C901: complexity, ratcheted (existing hot spots carry `noqa: C901`).
select = ["E9", "F", "I", "B", "UP", "SIM", "S", "C901", "RUF013"]
# B008: Typer options are function defaults by design. UP031: %-formatting is
# left as is (log calls must stay lazy).
ignore = ["B008", "UP031"]

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.lint.per-file-ignores]
# Tests assert, use throwaway secrets and drive local subprocesses.
"tests/**" = ["S101", "S104", "S105", "S106", "S108", "S311", "S314", "S603", "S607", "C901"]
"benchmarks/**" = ["S101", "S311", "S603", "C901"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-ra"
# Deprecations raised by newsworker itself fail the suite.
filterwarnings = ["error::DeprecationWarning:newsworker"]

[tool.mypy]
# The whole package is checked. Third-party stubs are often missing, so imports
# are treated leniently.
python_version = "3.10"
ignore_missing_imports = true
follow_imports = "silent"
disable_error_code = ["import-untyped"]
files = ["newsworker"]
check_untyped_defs = true

[tool.coverage.run]
branch = true
source = ["newsworker"]

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true
