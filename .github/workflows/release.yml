name: Release

# Runs when a version tag is pushed (e.g. v1.4.0): verifies the tag matches
# the package version, builds and checks the distributions, creates the GitHub
# release with the CHANGELOG notes, and publishes the container image to GHCR.
# Uploading to PyPI happens only when the repository variable
# PYPI_TRUSTED_PUBLISHING is "true" and PyPI trusted publishing is configured
# for this workflow and the "pypi" environment.

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dist:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Tag matches the package version
        id: version
        run: |
          version=$(python -c "import re;print(re.search(r'__version__ = \"([^\"]+)\"', open('newsworker/__init__.py').read()).group(1))")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "v$version" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package version $version" >&2
            exit 1
          fi
      - name: Build and check
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          twine check --strict dist/*
      - name: Wheel contains only the newsworker package
        run: |
          python - <<'PY'
          import glob, zipfile
          names = zipfile.ZipFile(glob.glob("dist/*.whl")[0]).namelist()
          stray = [n for n in names if not n.startswith(("newsworker/", "newsworker-"))]
          assert not stray, stray[:10]
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  github-release:
    needs: dist
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Release notes from CHANGELOG
        run: |
          python - "${{ needs.dist.outputs.version }}" > notes.md <<'PY'
          import re, sys
          text = open("CHANGELOG.md", encoding="utf-8").read()
          match = re.search(r"^## \[" + re.escape(sys.argv[1]) + r"\][^\n]*\n(.*?)(?=^## \[)", text, re.S | re.M)
          print(match.group(1).strip() if match else "See CHANGELOG.md.")
          PY
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --title "newsworker ${{ needs.dist.outputs.version }}" --notes-file notes.md --verify-tag

  pypi:
    needs: [dist, github-release]
    if: github.ref_type == 'tag' && vars.PYPI_TRUSTED_PUBLISHING == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  image:
    needs: dist
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
